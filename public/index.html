<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>HTTP Abort Playground</title><link rel="stylesheet" href="/styles.css"></head><body><main><header class="hero"><div><div class="eyebrow">HTTP ABORT PLAYGROUND</div><h1>HTTP Abort Playground</h1><p>A local AbortController simulator for request cancellation, timeouts, and completed responses.</p></div><img class="mark" src="/assets/mark.svg" alt=""></header><section class="panel"><div class="field"><label for="latency">Simulated request duration (ms)</label><input id="latency" type="number" min="100" max="10000" step="100" value="2400"></div><div class="controls"><button id="start" class="primary">Start request</button><button id="abort" class="danger" disabled>Abort active request</button><button id="clear">Clear log</button></div><div class="grid"><div class="visual"><p class="muted">Active request</p><div class="stat" id="status">Idle</div></div><div class="visual"><p class="muted">Request ID</p><div class="stat" id="request">—</div></div></div></section><section class="panel"><h2>🧾 Request lifecycle</h2><div id="log" class="log"></div></section><footer>Local-first learning tool · No account · No uploads</footer></main><script type="module" src="/app.js"></script></body></html>
